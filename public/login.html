<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Masuk · markdown.hanif.app</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body class="centered">
<div class="auth-card">
  <a class="brand" href="/">
    <svg class="docmark" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="M6.5 3h7L18 7.5V20a1 1 0 0 1-1 1H6.5a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1Z"/><path d="M13 3v4.5h4.5"/><path d="M8.5 12.5h7M8.5 15.5h7M8.5 18.5h4"/></svg>
    <span class="brand-word">Markdown</span><span class="brand-tld">.hanif.app</span>
  </a>

  <div class="tabs">
    <button class="tab active" id="tabLogin" type="button">Login</button>
    <button class="tab" id="tabRegister" type="button">Daftar</button>
  </div>

  <form id="authForm" autocomplete="on">
    <label class="auth-field">
      <span>Email</span>
      <input id="email" type="email" autocomplete="email" required placeholder="kamu@email.com">
    </label>
    <label class="auth-field">
      <span>Password</span>
      <input id="password" type="password" autocomplete="current-password" required placeholder="••••••••">
    </label>
    <p class="auth-hint" id="hint">Minimal 8 karakter.</p>
    <button class="btn primary block" id="submitBtn" type="submit">Login</button>
  </form>

  <p class="auth-err" id="err" hidden></p>
  <a class="auth-back" href="/">← Balik ke editor</a>
</div>
<script src="/auth.js"></script>
</body>
</html>
